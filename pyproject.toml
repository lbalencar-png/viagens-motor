[project]
name = "viagens-motor"
version = "0.1.0"
description = "Ferramentas de planejamento de viagem sobre fontes abertas: lugares, rotas, transporte público, clima, câmbio, calendário e custos."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12,<3.13"
dependencies = ["httpx>=0.28", "fastmcp>=4.0,<5", "timezonefinder>=6.5"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
viagens-motor = "viagens_motor.cli:main"
viagens-motor-mcp = "viagens_motor.mcp_server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/viagens_motor"]

[tool.pytest.ini_options]
markers = ["live: consulta as fontes reais (rodar com -m live)"]
addopts = "-m 'not live'"
testpaths = ["tests"]
pythonpath = ["src"]
